# Alternativa para GitHub Codespaces, donde la red entre contenedores de Docker
# está bloqueada. Usa la red del host, por lo que la app queda en el puerto 80.
# Uso: docker compose -f docker-compose.codespaces.yml up --build
services:
  redis:
    image: redis:7-alpine
    network_mode: host
  backend:
    build: ./backend
    network_mode: host
    environment:
      REDIS_HOST: 127.0.0.1
    depends_on: [redis]
  frontend:
    build: ./frontend
    network_mode: host
    extra_hosts:
      - "backend:127.0.0.1"
    depends_on: [backend]
