name: Plan review

# En cada pull request que toque terraform/, ejecuta `terraform plan` (solo lectura) y pide a un
# modelo desplegado en Azure AI Foundry que lo explique: qué cambia, riesgos y costo.
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/plan-review.yml"
      - ".github/plan-review-prompt.md"

permissions:
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_acr_name: ${{ vars.ACR_NAME }}
  TFSTATE_RG: ${{ vars.TFSTATE_RG }}
  TFSTATE_SA: ${{ vars.TFSTATE_SA }}

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configurar backend remoto
        working-directory: terraform
        run: |
          cat > backend_override.tf <<TF
          terraform {
            backend "azurerm" {
              resource_group_name  = "${TFSTATE_RG}"
              storage_account_name = "${TFSTATE_SA}"
              container_name       = "tfstate"
              key                  = "aks-microservicios.tfstate"
            }
          }
          TF

      # -lock=false: es una revisión de solo lectura y no debe bloquear un Deploy en curso.
      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock=false > "$RUNNER_TEMP/plan.txt" 2>&1 || true
          # Límite de tamaño para no exceder el contexto del modelo
          head -c 60000 "$RUNNER_TEMP/plan.txt" > "$RUNNER_TEMP/plan_trimmed.txt"

      - name: Revisión con Foundry
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_MODEL: ${{ vars.AZURE_OPENAI_MODEL }}
        run: |
          jq -n \
            --arg model "$AZURE_OPENAI_MODEL" \
            --rawfile system .github/plan-review-prompt.md \
            --rawfile plan "$RUNNER_TEMP/plan_trimmed.txt" \
            '{model: $model, messages: [
               {role: "system", content: $system},
               {role: "user", content: ("Salida de terraform plan:\n\n```\n" + $plan + "\n```")}
             ]}' > "$RUNNER_TEMP/request.json"

          HTTP=$(curl -sS -o "$RUNNER_TEMP/response.json" -w '%{http_code}' \
            "${AZURE_OPENAI_ENDPOINT%/}/chat/completions" \
            -H "Content-Type: application/json" \
            -H "api-key: $AZURE_OPENAI_API_KEY" \
            -d @"$RUNNER_TEMP/request.json" || echo 000)

          {
            echo "## Revisión automática de \`terraform plan\`"
            echo
            if [ "$HTTP" = "200" ] && jq -e '.choices[0].message.content' "$RUNNER_TEMP/response.json" >/dev/null; then
              jq -r '.choices[0].message.content' "$RUNNER_TEMP/response.json"
            else
              echo "No se pudo generar la revisión (HTTP $HTTP). Revisa el endpoint, el nombre del modelo y la clave."
              echo
              jq -r '.error.message // empty' "$RUNNER_TEMP/response.json" 2>/dev/null || true
            fi
            echo
            echo "<details><summary>terraform plan completo</summary>"
            echo
            echo '```'
            head -c 20000 "$RUNNER_TEMP/plan_trimmed.txt"
            echo '```'
            echo "</details>"
            echo
            echo "_Generado por un modelo de IA; verifica antes de aprobar._"
          } > "$RUNNER_TEMP/review.md"

      - name: Comentar en el pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/review.md"
